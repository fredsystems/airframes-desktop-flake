name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: Run pre-commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # This job also runs on pushes to main, where the checkout is on
          # main; the hook only exists to stop local commits there.
          SKIP: no-commit-to-branch
        run: |
          nix develop --command bash -e -c '
            set -euxo pipefail
            pre-commit run --all-files
          '

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The NixOS VM test needs hardware virtualisation.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3
        with:
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Use Determinate Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: false

      # Build-time library resolution (autoPatchelfHook) plus the install
      # checks: ldd, tray-library RUNPATH, glib-networking, desktop file.
      - name: Build package
        run: nix build --print-build-logs .#checks.x86_64-linux.package

      - name: NixOS VM test
        run: nix build --print-build-logs .#checks.x86_64-linux.vm-test -o vm-test

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-test-screenshot
          path: vm-test/*.png
          if-no-files-found: ignore
